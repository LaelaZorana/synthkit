[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "synthkit"
version = "0.4.0"
description = "Generate synthetic data and grade it for quality — LLM instruction & eval datasets, with validity / uniqueness / diversity / contamination scoring."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["synthetic-data", "llm", "fine-tuning", "evaluation", "data-quality", "contamination", "deduplication"]
dependencies = []  # core runs on the standard library alone

[project.optional-dependencies]
yaml = ["pyyaml>=6"]
anthropic = ["anthropic>=0.39"]
openai = ["openai>=1.40"]
fast = ["numpy>=1.21"]   # speeds up the optional semantic axis on large datasets
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
synthkit = "synthkit.cli:main"

[tool.setuptools]
packages = ["synthkit", "synthkit.text", "synthkit.tabular", "synthkit.privacy"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # long lines are tolerated in the embedded HTML report template
