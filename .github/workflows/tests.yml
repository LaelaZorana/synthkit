name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    name: tests (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The core is zero-dependency; pytest + ruff come from the [dev] extra.
      - name: Install (with dev deps)
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Run test suite
        run: pytest -q
      - name: Smoke-test the CLI
        run: |
          python main.py --version
          python main.py text gen --demo --no-color
